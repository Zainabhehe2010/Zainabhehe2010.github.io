<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer-Service Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #134e4a);
      color: white;
      padding: 25px 15px;
    }

    .container {
      width: min(650px, 100%);
      margin: auto;
    }

    .back-link {
      color: #99f6e4;
      text-decoration: none;
    }

    h1 {
      margin: 25px 0 8px;
      font-size: 2.3rem;
    }

    .subtitle {
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .chatbot {
      overflow: hidden;
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .chat-header {
      background: #0f766e;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status {
      font-size: 0.85rem;
      color: #ccfbf1;
    }

    .chat-area {
      height: 430px;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      margin-bottom: 13px;
      border-radius: 14px;
      color: #0f172a;
      line-height: 1.4;
    }

    .bot {
      background: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .user {
      background: #14b8a6;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .quick-questions {
      padding: 12px 15px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: white;
      border-top: 1px solid #e2e8f0;
    }

    .quick-questions button {
      white-space: nowrap;
      border: 1px solid #0f766e;
      background: white;
      color: #0f766e;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: white;
      border-top: 1px solid #e2e8f0;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 1rem;
    }

    .send-button {
      border: none;
      background: #0f766e;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-button:hover {
      background: #115e59;
    }
  </style>
</head>

<body>
  <main class="container">
    <a class="back-link" href="../../index.html">← Back to Portfolio</a>

    <h1>💬 Customer-Service Chatbot</h1>

    <p class="subtitle">
      A chatbot demo that responds to common customer questions.
    </p>

    <section class="chatbot">
      <div class="chat-header">
        <span style="font-size: 2rem;">🤖</span>

        <div>
          <strong>Zaina Support</strong>
          <div class="status">● Online</div>
        </div>
      </div>

      <div class="chat-area" id="chat">
        <div class="message bot">
          Hello! How can I help you today? You can ask about delivery,
          returns, opening hours, payment or contacting support.
        </div>
      </div>

      <div class="quick-questions">
        <button onclick="quickQuestion('Where is my order?')">
          Track order
        </button>

        <button onclick="quickQuestion('What is your return policy?')">
          Returns
        </button>

        <button onclick="quickQuestion('What are your opening hours?')">
          Opening hours
        </button>

        <button onclick="quickQuestion('How can I contact support?')">
          Contact
        </button>
      </div>

      <div class="input-area">
        <input
          id="userInput"
          type="text"
          placeholder="Type your question..."
          onkeydown="handleEnter(event)"
        >

        <button class="send-button" onclick="sendMessage()">Send</button>
      </div>
    </section>
  </main>

  <script>
    function addMessage(text, sender) {
      const chat = document.getElementById("chat");
      const message = document.createElement("div");

      message.className = "message " + sender;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function getBotReply(question) {
      const text = question.toLowerCase();

      if (
        text.includes("hello") ||
        text.includes("hi") ||
        text.includes("hey")
      ) {
        return "Hello! How can I help you today?";
      }

      if (
        text.includes("order") ||
        text.includes("delivery") ||
        text.includes("shipping") ||
        text.includes("track")
      ) {
        return "Orders normally arrive within 3–5 business days. You can track your order using the tracking link in your confirmation email.";
      }

      if (
        text.includes("return") ||
        text.includes("refund") ||
        text.includes("exchange")
      ) {
        return "You can return unused products within 30 days. Refunds are usually processed within 5 business days.";
      }

      if (
        text.includes("open") ||
        text.includes("hours") ||
        text.includes("time")
      ) {
        return "Our support team is available Monday to Friday, from 9:00 am to 5:00 pm.";
      }

      if (
        text.includes("payment") ||
        text.includes("card") ||
        text.includes("pay")
      ) {
        return "We accept Visa, Mastercard, PayPal and major debit cards.";
      }

      if (
        text.includes("contact") ||
        text.includes("email") ||
        text.includes("phone") ||
        text.includes("human")
      ) {
        return "You can contact our support team through the website contact form. A team member will respond within one business day.";
      }

      if (
        text.includes("thank")
      ) {
        return "You're welcome! Is there anything else I can help you with?";
      }

      return "I’m sorry, I don’t have an answer for that yet. Please ask about delivery, returns, opening hours, payments or contacting support.";
    }

    function sendMessage(customQuestion) {
      const input = document.getElementById("userInput");
      const question = customQuestion || input.value.trim();

      if (!question) {
        return;
      }

      addMessage(question, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(getBotReply(question), "bot");
      }, 500);
    }

    function quickQuestion(question) {
      sendMessage(question);
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>
</body>
</html>
