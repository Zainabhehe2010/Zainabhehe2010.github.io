<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Study Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #172554, #312e81);
      color: white;
      padding: 30px 15px;
    }

    .container {
      width: min(800px, 100%);
      margin: auto;
    }

    .back-link {
      color: #bfdbfe;
      text-decoration: none;
    }

    h1 {
      margin-top: 30px;
      font-size: 2.5rem;
    }

    .subtitle {
      color: #cbd5e1;
      margin: 10px 0 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #082f49;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    #results {
      display: none;
    }

    .plan-item {
      background: rgba(255, 255, 255, 0.08);
      margin-top: 12px;
      padding: 15px;
      border-radius: 10px;
    }

    .flashcards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .flashcard {
      min-height: 140px;
      padding: 20px;
      border-radius: 12px;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
    }

    .small-text {
      margin-top: 15px;
      color: #cbd5e1;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main class="container">
    <a class="back-link" href="../../index.html">← Back to Portfolio</a>

    <h1>📚 Smart Study Assistant</h1>

    <p class="subtitle">
      Enter a topic and create a personalised study session.
    </p>

    <section class="card">
      <label for="topic">What do you want to study?</label>
      <input
        id="topic"
        type="text"
        placeholder="Example: Photosynthesis"
      >

      <label for="time">How much time do you have?</label>
      <select id="time">
        <option value="30">30 minutes</option>
        <option value="45">45 minutes</option>
        <option value="60">60 minutes</option>
        <option value="90">90 minutes</option>
      </select>

      <button onclick="generateSession()">Generate Study Session</button>
    </section>

    <section class="card" id="results">
      <h2 id="resultTitle"></h2>

      <div id="plan"></div>

      <h2 style="margin-top: 30px;">Flashcards</h2>

      <p class="small-text">
        Click each card to reveal the study prompt.
      </p>

      <div class="flashcards" id="flashcards"></div>
    </section>
  </main>

  <script>
    function generateSession() {
      const topicInput = document.getElementById("topic");
      const topic = topicInput.value.trim();
      const totalTime = Number(document.getElementById("time").value);

      if (!topic) {
        alert("Please enter a topic first.");
        topicInput.focus();
        return;
      }

      const learnTime = Math.round(totalTime * 0.35);
      const practiseTime = Math.round(totalTime * 0.35);
      const reviewTime = totalTime - learnTime - practiseTime;

      document.getElementById("resultTitle").textContent =
        "Your " + topic + " Study Plan";

      document.getElementById("plan").innerHTML = `
        <div class="plan-item">
          <strong>1. Learn — ${learnTime} minutes</strong>
          <p>Read your notes and identify the main ideas in ${topic}.</p>
        </div>

        <div class="plan-item">
          <strong>2. Practise — ${practiseTime} minutes</strong>
          <p>Answer questions and explain ${topic} without looking at your notes.</p>
        </div>

        <div class="plan-item">
          <strong>3. Review — ${reviewTime} minutes</strong>
          <p>Correct mistakes and write a short summary from memory.</p>
        </div>
      `;

      const cards = [
        {
          front: "What is " + topic + "?",
          back: "Explain " + topic + " in your own words."
        },
        {
          front: "Key ideas",
          back: "List three important ideas related to " + topic + "."
        },
        {
          front: "Real example",
          back: "Give one real-world example of " + topic + "."
        },
        {
          front: "Check your understanding",
          back: "What part of " + topic + " do you still need to revise?"
        }
      ];

      const flashcardArea = document.getElementById("flashcards");
      flashcardArea.innerHTML = "";

      cards.forEach(card => {
        const element = document.createElement("div");
        element.className = "flashcard";
        element.textContent = card.front;

        let showingAnswer = false;

        element.addEventListener("click", () => {
          showingAnswer = !showingAnswer;
          element.textContent = showingAnswer ? card.back : card.front;
        });

        flashcardArea.appendChild(element);
      });

      document.getElementById("results").style.display = "block";
      document.getElementById("results").scrollIntoView({
        behavior: "smooth"
      });
    }
  </script>
</body>
</html>
