<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #581c87, #1e1b4b);
      color: white;
      padding: 30px 15px;
    }

    .container {
      width: min(650px, 100%);
      margin: auto;
    }

    .back-link {
      color: #e9d5ff;
      text-decoration: none;
    }

    h1 {
      margin: 30px 0 10px;
      font-size: 2.5rem;
      text-align: center;
    }

    .subtitle {
      color: #ddd6fe;
      text-align: center;
      margin-bottom: 30px;
    }

    .quiz-card {
      background: white;
      color: #111827;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .progress {
      color: #7e22ce;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #question {
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .answer {
      width: 100%;
      display: block;
      margin: 10px 0;
      padding: 14px;
      text-align: left;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 1rem;
    }

    .answer:hover {
      border-color: #9333ea;
      background: #faf5ff;
    }

    .answer.correct {
      background: #dcfce7;
      border-color: #22c55e;
    }

    .answer.wrong {
      background: #fee2e2;
      border-color: #ef4444;
    }

    .next-button,
    .restart-button {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #9333ea;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    #feedback {
      margin-top: 15px;
      font-weight: bold;
    }

    #result {
      display: none;
      text-align: center;
    }

    #result h2 {
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .score {
      font-size: 3rem;
      color: #9333ea;
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <main class="container">
    <a class="back-link" href="../../index.html">← Back to Portfolio</a>

    <h1>🧠 Interactive Quiz</h1>

    <p class="subtitle">
      Test your general knowledge and receive an instant score.
    </p>

    <section class="quiz-card">
      <div id="quiz">
        <p class="progress" id="progress"></p>
        <h2 id="question"></h2>
        <div id="answers"></div>
        <p id="feedback"></p>

        <button
          class="next-button"
          id="nextButton"
          onclick="nextQuestion()"
        >
          Next Question
        </button>
      </div>

      <div id="result">
        <h2>Quiz completed! 🎉</h2>
        <p>Your final score is:</p>
        <div class="score" id="score"></div>
        <p id="resultMessage"></p>

        <button
          class="restart-button"
          id="restartButton"
          onclick="restartQuiz()"
        >
          Try Again
        </button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Earth", "Mars", "Venus", "Jupiter"],
        correct: 1
      },
      {
        question: "What gas do plants absorb from the atmosphere?",
        answers: ["Oxygen", "Hydrogen", "Carbon dioxide", "Nitrogen"],
        correct: 2
      },
      {
        question: "What is 8 × 7?",
        answers: ["48", "54", "56", "64"],
        correct: 2
      },
      {
        question: "Which language is used to style a webpage?",
        answers: ["HTML", "CSS", "Python", "SQL"],
        correct: 1
      },
      {
        question: "What is the capital city of Australia?",
        answers: ["Sydney", "Melbourne", "Canberra", "Brisbane"],
        correct: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function showQuestion() {
      answered = false;

      const item = questions[currentQuestion];

      document.getElementById("progress").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

      document.getElementById("question").textContent = item.question;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextButton").style.display = "none";

      const answerArea = document.getElementById("answers");
      answerArea.innerHTML = "";

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = answer;
        button.onclick = () => checkAnswer(index);

        answerArea.appendChild(button);
      });
    }

    function checkAnswer(selectedIndex) {
      if (answered) return;

      answered = true;

      const item = questions[currentQuestion];
      const buttons = document.querySelectorAll(".answer");

      buttons[item.correct].classList.add("correct");

      if (selectedIndex === item.correct) {
        score++;
        document.getElementById("feedback").textContent =
          "Correct! Well done.";
      } else {
        buttons[selectedIndex].classList.add("wrong");
        document.getElementById("feedback").textContent =
          "Not quite. The correct answer is highlighted.";
      }

      document.getElementById("nextButton").style.display = "block";
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";
      document.getElementById("restartButton").style.display = "block";

      document.getElementById("score").textContent =
        `${score} / ${questions.length}`;

      let message;

      if (score === questions.length) {
        message = "Perfect score! Excellent work.";
      } else if (score >= 3) {
        message = "Good job! You have strong general knowledge.";
      } else {
        message = "Nice attempt! Try again and improve your score.";
      }

      document.getElementById("resultMessage").textContent = message;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;

      document.getElementById("quiz").style.display = "block";
      document.getElementById("result").style.display = "none";

      showQuestion();
    }

    showQuestion();
  </script>
</body>
</html>
